    <!-- theme before first paint: no flash of the wrong palette -->
    <script>
      (function () {
        try {
          // Dark is the default; a stored choice always wins.
          document.documentElement.setAttribute('data-theme', localStorage.getItem('edge:theme') || 'dark');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        document.documentElement.classList.add('js');
      })();
    </script>
